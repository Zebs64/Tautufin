name: Build Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Aucune valeur propre à l'instance ici : tout vient de la configuration Gitea
# (Paramètres du dépôt ou de l'organisation > Actions > Variables / Secrets).
#   vars.REGISTRY_HOST     nom d'hôte du registre de conteneurs (obligatoire)
#   vars.REGISTRY_USER     compte utilisé pour docker login (obligatoire)
#   vars.IMAGE_NAME        chemin de l'image, défaut : propriétaire/dépôt
#   secrets.REGISTRY_TOKEN jeton d'accès avec droit d'écriture sur les paquets
env:
  REGISTRY: ${{ vars.REGISTRY_HOST }}
  REGISTRY_USER: ${{ vars.REGISTRY_USER }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || gitea.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check registry configuration
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          missing=0
          for name in REGISTRY REGISTRY_USER REGISTRY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name n'est pas configuré dans Gitea (Actions > Variables / Secrets)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" \
            -u "$REGISTRY_USER" \
            --password-stdin

      - name: Build image
        env:
          REF: ${{ gitea.ref }}
        run: |
          IMAGE="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          docker build \
            -t "$IMAGE:${{ gitea.sha }}" \
            -t "$IMAGE:latest" \
            .

          if [[ "$REF" == refs/tags/* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            docker tag "$IMAGE:${{ gitea.sha }}" "$IMAGE:$VERSION_TAG"
          fi

      - name: Push image
        env:
          REF: ${{ gitea.ref }}
        run: |
          IMAGE="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          docker push "$IMAGE:${{ gitea.sha }}"
          docker push "$IMAGE:latest"
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            docker push "$IMAGE:$VERSION_TAG"
          fi
