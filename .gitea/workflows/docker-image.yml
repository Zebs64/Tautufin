name: Build Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: gitisane.moopi.ovh
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Gitea registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login "$REGISTRY" \
            -u "Leia" \
            --password-stdin

      - name: Build image
        env:
          REF: ${{ gitea.ref }}
        run: |
          IMAGE="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          docker build \
            -t "$IMAGE:${{ gitea.sha }}" \
            -t "$IMAGE:latest" \
            .

          if [[ "$REF" == refs/tags/* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            docker tag "$IMAGE:${{ gitea.sha }}" "$IMAGE:$VERSION_TAG"
          fi

      - name: Push image
        env:
          REF: ${{ gitea.ref }}
        run: |
          IMAGE="$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          docker push "$IMAGE:${{ gitea.sha }}"
          docker push "$IMAGE:latest"
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION_TAG="${REF#refs/tags/}"
            docker push "$IMAGE:$VERSION_TAG"
          fi
